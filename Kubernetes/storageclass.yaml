# StorageClass backing the MySQL StatefulSet persistent data.
# Uses the Amazon EBS CSI driver (install the aws-ebs-csi-driver EKS add-on).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
  labels:
    app.kubernetes.io/part-of: ivolve
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain

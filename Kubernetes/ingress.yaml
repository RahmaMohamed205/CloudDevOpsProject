# Ingress exposing the frontend microservice outside the cluster through an
# AWS Application Load Balancer (requires the AWS Load Balancer Controller
# add-on in the EKS cluster).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ivolve-ingress
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

# Headless Service for the MySQL StatefulSet. Gives every database pod a
# stable DNS name (mysql-0.mysql.ivolve.svc.cluster.local).
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ivolve
  labels:
    app: mysql
    app.kubernetes.io/part-of: ivolve
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

# Frontend (Node.js/Express) Deployment.
# The image registry/tag is updated automatically by the Jenkins pipeline
# ("Update Manifests" stage) and deployed by ArgoCD.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
  labels:
    app: frontend
    app.kubernetes.io/part-of: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: ivolve
    spec:
      containers:
        - name: frontend
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/ivolve/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: AUTH_SERVICE_URL
            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ROADMAP_SERVICE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: SESSION_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

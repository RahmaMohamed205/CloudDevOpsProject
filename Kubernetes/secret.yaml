# Sensitive environment variables.
#
# WARNING: the values below are obvious EXAMPLE values so that no real
# credentials are ever committed. Replace them with your own secrets before
# deploying (kubectl apply, sealed-secrets, External Secrets, etc.).
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: ivolve
  labels:
    app.kubernetes.io/part-of: ivolve
type: Opaque
stringData:
  # EXAMPLE VALUES - REPLACE BEFORE DEPLOYING
  DB_USER: example_user
  DB_PASSWORD: example_password
  MYSQL_ROOT_PASSWORD: example_root_password
  SESSION_SECRET: example_session_secret

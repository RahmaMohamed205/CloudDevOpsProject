[defaults]
inventory            = inventory/aws_ec2.yml
remote_user          = ubuntu
host_key_checking    = False
retry_files_enabled  = False
forks                = 5
stdout_callback      = default
display_skipped_hosts = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, auto, ini, yaml

[privilege_escalation]
become         = True
become_method  = sudo
become_user    = root
